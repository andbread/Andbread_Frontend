name: CI - Unit Test

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-unit-test-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: unit-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 빠르게 실패하는 순서로 배치한다. 타입 오류는 lint / test 를 돌리기 전에 끊는다.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test
